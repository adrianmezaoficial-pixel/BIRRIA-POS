<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3201a">
<title>Menú · Birria El Becerro</title>
<meta name="description" content="Menú y precios de Birria El Becerro. Haz tu pedido por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe7;--card:#fff;--ink:#251a17;--muted:#6f6059;--line:#e2d8cc;--chile:#a3201a;--green:#2e6b3b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171110;--card:#221917;--ink:#f3eae4;--muted:#a99a92;--line:#3a2d29;--chile:#8c1b15;--green:#79c987;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 Figtree,system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--chile);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 26px}
h1{font:400 2.2rem/1.1 "Alfa Slab One",Georgia,serif}
header p{margin-top:6px;opacity:.95}
main{max-width:640px;margin:0 auto;padding:20px 16px}
h2{font:400 1.3rem "Alfa Slab One",Georgia,serif;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px dashed var(--line)}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.it img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:1.08rem}.tx small{color:var(--muted);display:block}
.pr{color:var(--green);font-weight:800;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;font-weight:800;cursor:pointer}
.q span{min-width:20px;text-align:center;font-weight:800}
.info{margin-top:26px;color:var(--muted);text-align:center;font-size:.98rem}.info p{margin-top:6px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar[hidden]{display:none}
#go{display:block;max-width:608px;margin:0 auto;text-align:center;background:#178a47;color:#fff;font-weight:800;padding:14px;border-radius:12px;text-decoration:none}
#qrv{display:none;text-align:center;padding:30px 16px}
#qrv h2{border:0}
#qrbox{display:inline-block;background:#fff;color:#000;padding:16px;border-radius:12px;margin:18px 0}
#qrv p{color:var(--muted);word-break:break-all}
#qrv button{margin-top:16px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
body.qr #qrv{display:block}body.qr main,body.qr #bar,body.qr header p{display:none}
@media print{.noprint{display:none}body{background:#fff;color:#000}header{background:#fff;color:#000}#qrv p{color:#000}}
</style>
</head>
<body>
<header><h1 id="nm"></h1><p id="hr" hidden></p></header>
<main id="mn"></main>
<div id="qrv">
  <h2>Escanea y mira el menú</h2>
  <div id="qrbox"></div>
  <p id="qurl"></p>
  <button class="noprint" type="button" onclick="window.print()">Imprimir</button>
</div>
<div id="bar" hidden><a id="go" target="_blank" rel="noopener"></a></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== Edita aquí tus datos ===== */
const N={
  nombre:'Birria El Becerro',
  whatsapp:'',      // 52 + tus 10 dígitos, sin espacios. Ejemplo: 52XXXXXXXXXX
  horario:'',       // Ejemplo: Lunes a domingo, 6:00 pm a 12:00 am
  direccion:'',     // Ejemplo: Calle y número, colonia
  productos:[       // n = nombre, p = precio, c = categoría, d = descripción (opcional), img = foto (opcional)
    {n:'Quesabirria',p:80,c:'Comida'},
    {n:'Taco',p:25,c:'Comida'},
    {n:'Orden de Birria',p:150,c:'Comida'},
    {n:'Refresco',p:25,c:'Bebidas'}
  ]
};
/* ================================= */
/* Si el enlace trae ?m=..., los datos salen de tu app (QR generado en Menú QR) */
try{
  const m=new URLSearchParams(location.search).get('m');
  if(m){
    const s=m.replace(/-/g,'+').replace(/_/g,'/'),d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))));
    if(d.n)N.nombre=d.n;N.whatsapp=d.w||'';N.horario=d.h||'';N.direccion=d.d||'';
    N.productos=(d.p||[]).map(x=>({n:String(x[0]),p:Number(x[1])||0,c:x[2]||''}));
  }
}catch(e){}
const $=s=>document.querySelector(s);
const mx=n=>'$'+(n%1?n.toFixed(2):n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const w=String(N.whatsapp).replace(/\D/g,''),q={};
document.title='Menú · '+N.nombre;
$('#nm').textContent=N.nombre;
if(N.horario){$('#hr').textContent=N.horario;$('#hr').hidden=false}
function info(){
  return '<div class="info">'+(N.direccion?'<p>📍 '+esc(N.direccion)+'</p>':'')+(N.horario?'<p>🕒 '+esc(N.horario)+'</p>':'')+(w?'<p>Elige tus productos y manda tu pedido por WhatsApp.</p>':'<p>Haz tu pedido directamente en el local.</p>')+'</div>';
}
function draw(){
  const cs=[...new Set(N.productos.map(p=>p.c||'Menú'))];
  $('#mn').innerHTML=cs.map(c=>'<h2>'+esc(c)+'</h2>'+N.productos.map((p,i)=>({p,i})).filter(x=>(x.p.c||'Menú')===c).map(({p,i})=>
    `<div class="it">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:''}<div class="tx"><b>${esc(p.n)}</b>${p.d?`<small>${esc(p.d)}</small>`:''}<div class="pr">${mx(p.p)}</div></div>${w?`<div class="q"><button data-i="${i}" data-d="-1" aria-label="Quitar ${esc(p.n)}">−</button><span>${q[i]||0}</span><button data-i="${i}" data-d="1" aria-label="Agregar ${esc(p.n)}">+</button></div>`:''}</div>`).join('')).join('')+info();
  bar();
}
function bar(){
  const L=N.productos.map((p,i)=>({p,n:q[i]||0})).filter(x=>x.n>0),t=L.reduce((a,x)=>a+x.p.p*x.n,0);
  $('#bar').hidden=!L.length||!w;
  if(L.length&&w){
    $('#go').textContent='Pedir por WhatsApp · '+mx(t);
    $('#go').href='https://wa.me/'+w+'?text='+encodeURIComponent('Hola, quiero pedir:\n'+L.map(x=>'• '+x.n+' x '+x.p.n).join('\n')+'\nTotal: '+mx(t));
  }
}
$('#mn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;q[i]=Math.max(0,(q[i]||0)+Number(b.dataset.d));draw()});
draw();
/* Abre este mismo archivo con #qr al final del enlace para imprimir tu código QR */
if(location.hash==='#qr'){
  document.body.classList.add('qr');
  const u=location.href.split('#')[0];$('#qurl').textContent=u;
  if(window.QRCode)new QRCode($('#qrbox'),{text:u,width:240,height:240});else $('#qrbox').textContent='Conéctate a internet para generar el QR.';
}
</script>
</body>
</html>
